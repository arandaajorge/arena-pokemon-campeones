
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico de ajedrez</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
  padding: 20px;
}

button {
  width: 100%;
  padding: 16px;
  background: #16a34a;
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  margin: 10px 0;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

pre {
  background: #202c40;
  padding: 16px;
  border-radius: 12px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

input, select {
  display: block;
  box-sizing: border-box;
  width: 100%;
  padding: 12px;
  margin: 8px 0 16px;
  background: #202c40;
  color: white;
  border: 1px solid #64748b;
  border-radius: 8px;
  font-size: 18px;
}
</style>
</head>

<body>

<h2>🧸 Ajedrez de campeones 🦫</h2>

<p>Diagnóstico temporal del servidor — V4</p>

<button onclick="probarSesion()">
  1. Comprobar sesión
</button>

<button onclick="probarMotor()">
  2. Comprobar motor autenticado
</button>

<hr>

<h3>Pruebas de movimientos reales</h3>

<label>Casilla de origen</label>
<input id="origen" value="e2" maxlength="2">

<label>Casilla de destino</label>
<input id="destino" value="e4" maxlength="2">

<label>Versión esperada</label>
<input id="version" type="number" value="0" min="0">

<label>Promoción de peón</label>

<select id="promocion">
  <option value="">Sin promoción</option>
  <option value="q">♛ Reina</option>
  <option value="r">♜ Torre</option>
  <option value="b">♝ Alfil</option>
  <option value="n">♞ Caballo</option>
</select>

<button id="botonMovimiento" onclick="probarMovimiento()">
  3. Ejecutar movimiento real
</button>

<button onclick="consultarPartida()">
  4. Consultar estado de partida
</button>

<pre id="resultado">Esperando prueba...</pre>

<script>

const SUPABASE_URL =
  "https://bwupxxeeaewdstjzmwob.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_oeSBm8VNRI5Upna4skkHKg_JOB5rbDU";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const PARTIDA_PRUEBA =
  "626d37fe-4534-44b2-8689-119a38e3288b";

function mostrar(data) {
  document.getElementById("resultado").textContent =
    JSON.stringify(data, null, 2);
}

async function probarSesion() {

  try {

    const { data, error } =
      await db.auth.getSession();

    if (error || !data.session) {
      mostrar({
        success: false,
        error: "No existe una sesión activa"
      });
      return;
    }

    const usuario = await db.auth.getUser();

    if (usuario.error || !usuario.data.user) {
      mostrar({
        success: false,
        error: "Sesión no válida"
      });
      return;
    }

    const perfil = await db
      .from("players")
      .select("nickname")
      .eq("id", usuario.data.user.id)
      .single();

    mostrar({
      success: true,
      sesion_valida: true,
      player_id: usuario.data.user.id,
      jugador: perfil.data?.nickname || "Sin perfil",
      perfil_encontrado: !perfil.error,
      usuario_anonimo: usuario.data.user.is_anonymous
    });

  } catch (error) {

    mostrar({
      success: false,
      error: error.message
    });

  }

}

async function probarMotor() {

  try {

    const { data, error } =
      await db.auth.getSession();

    if (error || !data.session) {
      mostrar({
        success: false,
        error: "No existe una sesión activa"
      });
      return;
    }

    const response = await fetch(
      SUPABASE_URL + "/functions/v1/chess-engine",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization":
            "Bearer " + data.session.access_token,
          "apikey": SUPABASE_KEY
        },
        body: JSON.stringify({
          action: "move",
          match_id:
            "00000000-0000-0000-0000-000000000000",
          expected_version: 0,
          from: "e2",
          to: "e4"
        })
      }
    );

    mostrar({
      http_status: response.status,
      respuesta: await response.json()
    });

  } catch (error) {

    mostrar({
      success: false,
      error: error.message
    });

  }

}

async function probarMovimiento() {

  const boton =
    document.getElementById("botonMovimiento");

  if (boton.disabled) return;

  boton.disabled = true;
  boton.textContent = "Procesando movimiento...";

  try {

    const { data, error } =
      await db.auth.getSession();

    if (error || !data.session) {
      throw new Error("No existe sesión activa");
    }

    const origen = document
      .getElementById("origen")
      .value.trim().toLowerCase();

    const destino = document
      .getElementById("destino")
      .value.trim().toLowerCase();

    const versionTexto = document
      .getElementById("version").value;

    const version = Number(versionTexto);

    const promocion = document
      .getElementById("promocion").value;

    if (
      !/^[a-h][1-8]$/.test(origen) ||
      !/^[a-h][1-8]$/.test(destino)
    ) {
      throw new Error("Casillas no válidas");
    }

    if (
      versionTexto.trim() === "" ||
      !Number.isSafeInteger(version) ||
      version < 0
    ) {
      throw new Error("Versión no válida");
    }

    const solicitud = {
      action: "move",
      match_id: PARTIDA_PRUEBA,
      expected_version: version,
      from: origen,
      to: destino
    };

    if (promocion !== "") {
      solicitud.promotion = promocion;
    }

    const response = await fetch(
      SUPABASE_URL + "/functions/v1/chess-engine",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization":
            "Bearer " + data.session.access_token,
          "apikey": SUPABASE_KEY
        },
        body: JSON.stringify(solicitud)
      }
    );

    mostrar({
      http_status: response.status,
      solicitud: solicitud,
      respuesta: await response.json()
    });

  } catch (error) {

    mostrar({
      success: false,
      error: error.message
    });

  } finally {

    boton.disabled = false;
    boton.textContent = "3. Ejecutar movimiento real";

  }

}

async function consultarPartida() {

  try {

    const { data, error } = await db
      .from("game_matches")
      .select(
        "id,status,version,current_turn,game_state,winner_id"
      )
      .eq("id", PARTIDA_PRUEBA)
      .single();

    if (error) throw error;

    mostrar({
      success: true,
      estado: data.status,
      version: data.version,
      turno: data.game_state.turn,
      fen: data.game_state.fen,
      movimientos: data.game_state.moves,
      capturas: data.game_state.captured,
      jaque: data.game_state.check,
      jaque_mate: data.game_state.checkmate,
      tablas: data.game_state.draw,
      ganador: data.winner_id
    });

  } catch (error) {

    mostrar({
      success: false,
      error: error.message
    });

  }

}
</script>

</body>
</html>
